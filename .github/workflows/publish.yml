name: Publish

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Verify registry versions match tag
        run: jq -e --arg v "${GITHUB_REF_NAME#v}" '.version == $v and all(.packages[]; .version == $v) and all(.packages[].runtimeArguments[]? | select(.name == "--with" and (.value | test("^rnds(\\[[^\\]]*\\])?(==|$)"))); .value | test("^rnds(\\[[^\\]]*\\])?==" + ($v | gsub("\\."; "\\.")) + "$"))' server.json
      - name: Verify tag matches package version
        run: test -f "dist/rnds-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - name: Verify wheel __version__ matches tag
        run: uv run --isolated --no-project --with "dist/rnds-${GITHUB_REF_NAME#v}-py3-none-any.whl" python -c 'import os, rnds; assert rnds.__version__ == os.environ["GITHUB_REF_NAME"].removeprefix("v"), rnds.__version__'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rnds
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
